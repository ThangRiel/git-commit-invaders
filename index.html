<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Commit Invaders</title>
    <meta
      name="description"
      content="3D Three.js arcade shooter powered by your GitHub contribution graph."
    />
    <meta property="og:title" content="Git Commit Invaders" />
    <meta
      property="og:description"
      content="3D Three.js arcade shooter powered by your GitHub contribution graph."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-[#050811] text-slate-100 overflow-hidden select-none">
    <div id="webgl-mount" class="fixed inset-0 w-full h-full"></div>

    <!-- Top Minimal HUD (unboxed, high-contrast, zero viewport occlusion) -->
    <header
      class="fixed top-0 left-0 right-0 z-10 pointer-events-none flex flex-wrap items-start justify-between gap-4 bg-gradient-to-b from-[#050811]/95 via-[#050811]/75 to-transparent px-5 pt-4 pb-8 sm:px-7"
    >
      <div class="pointer-events-auto flex flex-col gap-1">
        <div class="flex flex-wrap items-center gap-3">
          <h1 class="font-display text-xl sm:text-2xl font-bold tracking-tight text-sky-300 whitespace-nowrap">
            Git Commit Invaders
          </h1>
          <span class="text-slate-500" aria-hidden="true">/</span>
          <a
            href="https://github.com/ThangRiel"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-100 hover:text-sky-300 underline-offset-4 hover:underline transition-colors whitespace-nowrap"
          >
            <svg class="w-4 h-4 text-slate-300" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            ThangRiel
          </a>
        </div>
        <p id="controls-hint" class="text-xs font-medium text-slate-300">
          Move: A / D, Arrows, Drag · Weapons: 1-4 · Pause: P · Mute: M
        </p>
        <p id="upgrade-status" class="hidden text-xs font-mono font-medium text-amber-300 tabular-nums"></p>
      </div>

      <div class="flex items-baseline gap-3 sm:gap-5 pt-0.5 text-xs sm:text-sm text-slate-300 font-mono tabular-nums">
        <span>
          Score
          <strong id="hud-score" class="ml-1.5 text-base sm:text-lg font-bold text-slate-50">0</strong>
        </span>
        <span class="text-slate-600" aria-hidden="true">·</span>
        <span>
          Best
          <strong id="hud-best" class="ml-1.5 text-slate-100 font-semibold">0</strong>
        </span>
        <span class="text-slate-600" aria-hidden="true">·</span>
        <span>
          Commits
          <strong id="hud-remaining" class="ml-1.5 text-emerald-400 font-semibold">0</strong>
        </span>
      </div>
    </header>

    <!-- Center Game State Scrim (Paused / Game Over / Victory / Context Lost) -->
    <div
      id="state-overlay"
      class="fixed inset-0 z-20 hidden items-center justify-center bg-[#050811]/80 px-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="overlay-title"
    >
      <div class="w-full max-w-md rounded-xl border border-slate-800 bg-[#0b101d] p-7 text-center shadow-2xl">
        <h2 id="overlay-title" class="font-display text-3xl font-bold text-rose-400">
          Game Over
        </h2>
        <p id="overlay-subtitle" class="mt-2 text-sm text-slate-400">
          A commit invader breached your ship defenses.
        </p>

        <div class="mt-6 flex items-center justify-center gap-6 border-y border-slate-800/80 py-4 font-mono tabular-nums">
          <div>
            <div class="text-xs text-slate-500">Total Score</div>
            <div id="overlay-score" class="mt-0.5 text-2xl font-bold text-slate-100">0</div>
          </div>
          <div class="h-8 w-px bg-slate-800"></div>
          <div>
            <div class="text-xs text-slate-500">Best Score</div>
            <div id="overlay-best" class="mt-0.5 text-2xl font-bold text-emerald-400">0</div>
          </div>
        </div>

        <div class="mt-6 flex items-center justify-center gap-3">
          <button
            id="overlay-primary-btn"
            type="button"
            class="px-5 py-2.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 text-sm font-semibold transition-colors cursor-pointer whitespace-nowrap"
          >
            Play Again
          </button>
          <button
            id="overlay-secondary-btn"
            type="button"
            class="hidden px-5 py-2.5 rounded-lg border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200 text-sm font-medium transition-colors cursor-pointer whitespace-nowrap"
          >
            Restart
          </button>
        </div>

        <p id="overlay-keyhint" class="mt-4 text-xs text-slate-500">
          Press Enter to restart
        </p>
      </div>
    </div>

    <!-- Unified Collapsible Bottom Control Dock -->
    <div id="dock-wrapper" class="dock-wrapper fixed bottom-5 left-1/2 z-10 -translate-x-1/2 flex flex-col items-center">
      <button
        id="dock-toggle-btn"
        type="button"
        class="mb-1.5 px-3 py-1 rounded-t-lg border border-b-0 border-slate-800 bg-[#0b101d]/95 text-xs font-medium text-slate-400 hover:text-slate-100 transition-colors cursor-pointer whitespace-nowrap"
        aria-expanded="true"
        aria-controls="control-dock"
      >
        Hide Controls (H)
      </button>

      <nav
        id="control-dock"
        aria-label="Game controls"
        class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5 rounded-xl border border-slate-800 bg-[#0b101d]/95 px-3 py-2 shadow-xl max-w-[96vw]"
      >
        <!-- Weapon Firing Modes -->
        <div class="flex items-center gap-1 rounded-lg bg-slate-900/90 p-1" role="group" aria-label="Firing mode">
          <button
            type="button"
            data-weapon="pulse"
            class="weapon-btn px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap bg-amber-500/20 text-amber-300"
          >
            1 · Pulse
          </button>
          <button
            type="button"
            data-weapon="spread"
            class="weapon-btn px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap text-slate-400 hover:text-slate-100"
          >
            2 · Spread
          </button>
          <button
            type="button"
            data-weapon="helix"
            class="weapon-btn px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap text-slate-400 hover:text-slate-100"
          >
            3 · Helix
          </button>
          <button
            type="button"
            data-weapon="rail"
            class="weapon-btn px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap text-slate-400 hover:text-slate-100"
          >
            4 · Rail
          </button>
        </div>

        <div class="hidden sm:block h-5 w-px bg-slate-800"></div>

        <!-- Camera Presets -->
        <div class="flex items-center gap-1 rounded-lg bg-slate-900/90 p-1" role="group" aria-label="Camera angle">
          <button
            type="button"
            data-camera="arcade"
            class="cam-btn px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap bg-sky-500/20 text-sky-300"
          >
            Arcade
          </button>
          <button
            type="button"
            data-camera="top"
            class="cam-btn px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap text-slate-400 hover:text-slate-100"
          >
            Top
          </button>
          <button
            type="button"
            data-camera="dynamic"
            class="cam-btn px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap text-slate-400 hover:text-slate-100"
          >
            Dynamic
          </button>
        </div>

        <div class="hidden sm:block h-5 w-px bg-slate-800"></div>

        <!-- Gameplay & Audio Controls -->
        <div class="flex items-center gap-1.5">
          <button
            id="autofire-btn"
            type="button"
            class="px-3 py-1.5 rounded-lg border border-emerald-500/40 bg-emerald-500/15 text-emerald-300 text-xs font-medium transition-colors cursor-pointer whitespace-nowrap"
          >
            Auto-Fire: On
          </button>
          <button
            id="mute-btn"
            type="button"
            class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs font-medium transition-colors cursor-pointer whitespace-nowrap"
          >
            Sound: On
          </button>
          <button
            id="pause-btn"
            type="button"
            class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs font-medium transition-colors cursor-pointer whitespace-nowrap"
          >
            Pause
          </button>
          <button
            id="restart-btn"
            type="button"
            class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs font-medium transition-colors cursor-pointer whitespace-nowrap"
          >
            Restart
          </button>
        </div>
      </nav>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
